<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lexi OS</title>
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/apps/calculator/calculator.css">
    <link rel="stylesheet" href="./src/apps/aboutme/aboutme.css">
    <link rel="stylesheet" href="./src/apps/music/music.css">
    <link rel="stylesheet" href="./src/apps/finance/finance.css">
    <link rel="stylesheet" href="./src/apps/notes/notes.css">
    <link rel="stylesheet" href="./src/apps/wallpapers/wallpaper.css">
    <link rel="stylesheet" href="./src/apps/translator/translator.css">
    <link rel="stylesheet" href="./src/apps/currencyconverter/currencyconverter.css">
</head>
<body>

    <div id="boot-screen">
        <h1 class="lexi-text">LEXI OS</h1>
        <p class="os-text">SYSTEM INITIATING...</p>
    </div>


    <div id="desktop">
        

        <div class="dock">
            
            <div class="app-container">
                <div class="dock-app app-navy" data-action="browser">
                    <img src="./public/assets/icons/browser.svg" alt="Browser">
                </div>
                <span class="app-label">Browser</span>
            </div>

            <div class="app-container">
                <div class="dock-app app-teal" data-action="music">
                    <img src="./public/assets/icons/music.svg" alt="Wallpapers">
                </div>
                <span class="app-label">Music</span>
            </div>

            <div class="app-container">
                <div class="dock-app app-blue" data-action="wallpapers">
                    <img src="./public/assets/icons/weather.svg" alt="Wallpapers">
                </div>
                <span class="app-label">Wallpapers</span>
            </div>
            
            <div class="app-container">
                <div class="dock-app app-teal" data-action="calculator">
                    <img src="./public/assets/icons/calculator.svg" alt="Calculator">
                </div>
                <span class="app-label">Calculator</span>
            </div>

            <div class="app-container">
                <div class="dock-app app-navy" data-action="translator">
                    <img src="./public/assets/icons/settings.svg" alt="Translator">
                </div>
                <span class="app-label">Translator</span>
            </div>

           <div class="app-container">
                <div class="dock-app app-teal" data-action="notes">
                    <img src="./public/assets/icons/calculator.svg" alt="Notes">
                </div>
                <span class="app-label">Notes</span>
            </div>

            <div class="app-container">
                <div class="dock-app app-navy" data-action="aboutme">
                    <img src="./public/assets/icons/app-store.svg" alt="About Me">
                </div>
                <span class="app-label">About Me</span>
            </div>

            <div class="app-container">
                <div class="dock-app app-navy" data-action="currencyconverter">
                    <img src="./public/assets/icons/messages.svg" alt="Currency Converter">
                </div>
                <span class="app-label">Currency Converter</span>
            </div>

            <div class="dock-divider"></div>
            <div class="dock-clock" id="dock-time">--:--</div>
        </div>

    </div>

    <script src="./src/js/script.js"></script>
    <script src="./src/apps/calculator/calculator.js"></script>
    <script src="./src/apps/aboutme/aboutme.js"></script>
    <script src="./src/apps/music/music.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./src/apps/finance/finance.js"></script>
    <script src="./src/apps/notes/notes.js"></script>
    <script src="./src/apps/wallpapers/wallpapers.js"></script>
    <script src="./src/apps/translator/translator.js"></script>
    <script src="./src/apps/currencyconverter/currencyconverter.js"></script>
    
</body>
</html>
